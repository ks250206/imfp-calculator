[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/tui",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ks250206/imfp-calculator"

[workspace.dependencies]
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
crossterm = "0.28"
image = { version = "0.25.6", default-features = false }
periodic-table-on-an-enum = "0.3.2"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "ttf"] }
plotters-bitmap = "0.3.7"
predicates = "3.1"
ratatui = "0.29"
ratatui-image = { version = "8.0.2", default-features = false, features = ["crossterm", "image-defaults"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
