[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/tui",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/tpp2m"

[workspace.dependencies]
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
crossterm = "0.28"
predicates = "3.1"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
